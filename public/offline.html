<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08111F">
    <title>Hors connexion - DevRoad</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
            background: #08111F; color: #F4F6FA;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { width: 100%; max-width: 360px; text-align: center; }
        img { width: 72px; height: 72px; object-fit: contain; }
        h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.03em; }
        p { margin: 0; color: #A3AEC2; font-size: 15px; line-height: 1.55; }
        .road { margin: 28px auto; width: 120px; height: 4px; border-radius: 4px; background: repeating-linear-gradient(90deg, #FF6A00 0 18px, transparent 18px 30px); opacity: .8; }
        a {
            display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px;
            background: #FF6A00; color: #fff; font-weight: 700; text-decoration: none; font-size: 16px;
        }
        a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="DevRoad">
        <h1>Pas de connexion</h1>
        <p>DevRoad n’arrive pas à joindre Internet. Vérifie ta data ou ton Wi-Fi, puis réessaie.</p>
        <div class="road" aria-hidden="true"></div>
        <a href="/dashboard">Réessayer</a>
    </main>
</body>
</html>
