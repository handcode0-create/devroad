name: DevRoad deployment readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,xml,ctype,curl,fileinfo,openssl,pdo,pdo_sqlite,sqlite3,tokenizer,bcmath,intl,zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Clear Laravel caches
        run: php artisan optimize:clear

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate --force

      - name: Check routes
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan route:list

      - name: Run tests
        run: php artisan test
